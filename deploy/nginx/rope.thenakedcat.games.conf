# Rope Racers -- the HOST nginx site for rope.thenakedcat.games, Cloudflare SSL mode "Flexible":
#   players --https/wss--> Cloudflare --http/ws--> this nginx (port 80) --http--> the container on 127.0.0.1:8080
# No certificate on the VPS. Do NOT redirect to https here (Cloudflare "Always Use HTTPS" does that) -- with
# Flexible, a redirect here loops forever.
#
# Install:
#   sudo cp rope.thenakedcat.games.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/rope.thenakedcat.games.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

# WebSocket upgrade (delete this block if your nginx.conf already defines $connection_upgrade).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name rope.thenakedcat.games;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # A lobby can be quiet for a while: keep WebSockets open for an hour.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
